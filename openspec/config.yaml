# OpenSpec configuration for ChatBot-WA (BuilderBot monorepo)
# Generated by sdd-init

project: 'ChatBot-WA'
description: 'BuilderBot - Open source WhatsApp bot library for MVP and small businesses'

# Artifact store configuration
artifact_store:
    default: 'engram' # prefer engram when available; falls back to openspec files
    openspec_dir: 'openspec'

# Strict TDD mode (enforced by gentle-ai)
strict_tdd: true

# Test runner configuration
test_runner:
    primary: 'mixed' # Jest and UVU coexist in this monorepo
    jest:
        packages:
            - '@builderbot/provider-baileys'
            - '@builderbot/provider-evolution-api'
            - '@builderbot/provider-facebook-messenger'
            - '@builderbot/provider-gupshup'
            - '@builderbot/provider-instagram'
            - '@builderbot/provider-meta'
            - '@builderbot/provider-sherpa'
            - '@builderbot/provider-twilio'
            - '@builderbot/provider-venom'
            - '@builderbot/provider-web-whatsapp'
            - '@builderbot/provider-wppconnect'
        single_file_cmd: 'pnpm --filter <package> exec jest <test-file> --runInBand'
    uvu:
        packages:
            - '@builderbot/bot'
            - '@builderbot/cli'
            - '@builderbot/manager'
            - '@builderbot/contexts-dialogflow'
            - '@builderbot/contexts-dialogflow-cx'
            - '@builderbot/database-json'
            - '@builderbot/database-mongo'
            - '@builderbot/database-mysql'
            - '@builderbot/database-postgres'
            - 'eslint-plugin-builderbot'
        single_file_cmd: "pnpm --filter <package> exec uvu -r tsm <test-dir> '<anchored-regex>'"
    root_commands:
        test: 'pnpm test'
        test_coverage: 'pnpm run test:coverage'
        lint_check: 'pnpm run lint:check'
        lint_fix: 'pnpm run lint:fix'
        format_check: 'pnpm run format:check'
        format_write: 'pnpm run format:write'
        build: 'pnpm run build'

# SDD phase rules
phases:
    proposal:
        required: true
        description: 'Investigate idea, compare approaches, produce proposal'
    spec:
        required: true
        depends_on: ['proposal']
        description: 'Write detailed specification from accepted proposal'
    design:
        required: false
        depends_on: ['proposal']
        description: 'Architectural design, interfaces, data models'
    tasks:
        required: true
        depends_on: ['spec', 'design']
        description: 'Break spec/design into executable tasks with acceptance criteria'
    apply:
        required: true
        depends_on: ['tasks']
        description: 'Implement tasks in batches, follow strict TDD'
    verify:
        required: true
        depends_on: ['apply']
        description: 'Validate implementation against spec, run tests'
    archive:
        required: true
        depends_on: ['verify']
        description: 'Close change, persist final state'

# Monorepo specifics
monorepo:
    tool: 'pnpm + lerna + nx'
    workspace_root: '.'
    packages_glob: 'packages/*'
    package_manager: 'pnpm@9'
    node_version: '>=18 (CI uses Node 22.20.0)'
    build_output: 'packages/**/dist'

# Code style conventions
style:
    indent: 4
    quotes: 'single'
    semicolons: false
    trailing_comma: 'es5'
    print_width: 120
    import_order:
        - 'builtin + external'
        - 'internal'
        - 'parent + sibling + index'
        - blank line between groups
        - alphabetical within groups (case-insensitive)

# Naming conventions
naming:
    files: 'follow local package conventions (camelCase, kebab-case, dotted)'
    classes_types: 'PascalCase'
    functions_vars_methods: 'camelCase'
    constants: 'UPPER_SNAKE_CASE'

# BuilderBot flow conventions (preserve when touching flow callbacks)
builderbot_flows:
    - 'return gotoFlow(...)'
    - 'return endFlow(...)'
    - 'return fallBack(...)'
    - 'await flowDynamic(...)'
    - 'await state.update(...)'
    - 'Do not mix endFlow and flowDynamic in same execution context'

# Test conventions
test_conventions:
    test_dirs:
        - '__tests__' # most packages
        - '_test_' # CLI package
    file_suffix: '.test.ts or .spec.ts (per package)'
    uvu_requires: 'test.run()'
    mock_external_deps: true
    deterministic_isolated: true

# Delivery strategy defaults (can be overridden per change)
delivery_strategy:
    default: 'ask-on-risk'
    chain_strategy_default: 'stacked-to-main'

# Skill registry path (for sub-agent injection)
skill_registry:
    path: '.atl/skill-registry.md'
    last_refresh: '2026-08-31'
