# ChatBot-WA / BuilderBot — Multi-service Docker Compose (base)
# Spec §File Structure | Spec §Multi-Service Docker Compose
# Usage: docker-compose up -d
# Overrides: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Production: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

name: builderbot

services:
    # --------------------------------------------------------
    # Bot application (main BuilderBot service)
    # --------------------------------------------------------
    bot:
        build:
            context: .
            dockerfile: Dockerfile
            target: bot
        container_name: builderbot-bot
        restart: unless-stopped
        env_file: .env
        environment:
            - NODE_ENV=${NODE_ENV:-production}
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_NAME=${DB_NAME:-builderbot}
            - MONGO_HOST=mongodb
            - MONGO_PORT=27017
            - MONGO_DB=${MONGO_DB:-builderbot}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
        ports:
            - '3000:3000'
        networks:
            - builderbot-network
        depends_on:
            postgres:
                condition: service_healthy
            mongodb:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - bot_assets:/app/assets
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 10s

    # --------------------------------------------------------
    # PostgreSQL — primary relational DB
    # --------------------------------------------------------
    postgres:
        image: postgres:16-alpine
        container_name: builderbot-postgres
        restart: unless-stopped
        env_file: .env
        environment:
            POSTGRES_USER: ${DB_USER:-builderbot}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
            POSTGRES_DB: ${DB_NAME:-builderbot}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - builderbot-network
        # No published ports (spec §Internal Networking: DB services hidden)
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-builderbot} -d ${DB_NAME:-builderbot}']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    # --------------------------------------------------------
    # MongoDB — secondary document DB
    # --------------------------------------------------------
    mongodb:
        image: mongo:7
        container_name: builderbot-mongodb
        restart: unless-stopped
        env_file: .env
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-}
        volumes:
            - mongo_data:/data/db
        networks:
            - builderbot-network
        # No published ports
        healthcheck:
            test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    # --------------------------------------------------------
    # Redis — caching layer
    # --------------------------------------------------------
    redis:
        image: redis:7-alpine
        container_name: builderbot-redis
        restart: unless-stopped
        env_file: .env
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        networks:
            - builderbot-network
        # No published ports
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s

# --------------------------------------------------------
    # --------------------------------------------------------
    # n8n — CRM workflow engine (webhook + Google Calendar/Sheets)
    # --------------------------------------------------------
    n8n:
        image: n8nio/n8n:1.0.0
        container_name: builderbot-n8n
        restart: unless-stopped
        networks:
            - builderbot-network
        environment:
            - N8N_BASIC_AUTH_ACTIVE=true
            - WEBHOOK_URL=${WEBHOOK_URL:-http://n8n:5678/webhook}
            - DB_TYPE=postgresdb
            - DB_POSTGRESDB_HOST=${DB_HOST:-postgres}
            - DB_POSTGRESDB_PORT=${DB_PORT:-5432}
            - DB_POSTGRESDB_DATABASE=${DB_NAME:-builderbot}
            - DB_POSTGRESDB_USER=${DB_USER:-builderbot}
            - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD:-changeme}
            - CRM_WEBHOOK_SECRET=${CRM_WEBHOOK_SECRET}
            - GOOGLE_APPLICATION_CREDENTIALS=/home/node/.n8n/gsa.json
            - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID}
            - GOOGLE_SHEETS_ID=${GOOGLE_SHEETS_ID}
        volumes:
            - "./packages/crm-workflows:/home/node/.n8n/workflows:ro"
            - "./secrets/google-service-account.json:/home/node/.n8n/gsa.json:ro"
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:5678/healthz']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

# Named volumes (persist across restarts — spec §Volume Strategy)
# --------------------------------------------------------
volumes:
    postgres_data:
        driver: local
    mongo_data:
        driver: local
    redis_data:
        driver: local
    bot_assets:
        driver: local

# --------------------------------------------------------
# Internal bridge network (spec §Internal Networking)
# --------------------------------------------------------
networks:
    builderbot-network:
        driver: bridge
        name: builderbot-network
